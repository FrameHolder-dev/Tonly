services:
  api:
    build: .
    container_name: tonly-api
    restart: unless-stopped
    ports:
      - "3100:8080"
    volumes:
      - subscribers-data:/data
    env_file:
      - .env
      - .env.secrets
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  subscribers-data:
