<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>404 — Tonly</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--bg:#FFF;--bg-gray:#F5F5F7;--text:#1D1D1F;--text-s:#6E6E73;--accent:#0098EA}
        html{-webkit-font-smoothing:antialiased}
        body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column}
        .wrap{text-align:center;padding:24px}
        .wrap img{width:64px;height:64px;border-radius:16px;margin-bottom:32px}
        .wrap h1{font-size:72px;font-weight:900;letter-spacing:-0.04em;margin-bottom:8px}
        .wrap p{font-size:17px;color:var(--text-s);margin-bottom:40px}
        .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 28px;border-radius:100px;font-size:15px;font-weight:600;text-decoration:none;background:var(--text);color:var(--bg);transition:opacity .2s}
        .btn:hover{opacity:.85}
    </style>
</head>
<body>
    <div class="wrap">
        <img src="/assets/logo.svg" alt="Tonly">
        <h1>404</h1>
        <p>This page doesn't exist.</p>
        <a href="/en/" class="btn">Go Home</a>
    </div>
</body>
</html>
